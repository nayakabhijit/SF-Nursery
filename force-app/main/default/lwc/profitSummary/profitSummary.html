<template>
    <lightning-card title="Profit &amp; Loss" icon-name="standard:currency">
        <div slot="actions" class="actions">
            <lightning-combobox
                class="year-picker"
                label="Year"
                variant="label-hidden"
                value={yearValue}
                options={yearOptions}
                onchange={handleYearChange}
            ></lightning-combobox>
            <lightning-button-icon
                icon-name="utility:refresh"
                alternative-text="Refresh"
                title="Refresh"
                onclick={handleRefresh}
            ></lightning-button-icon>
        </div>

        <div class="slds-var-p-horizontal_medium slds-var-p-bottom_medium body">
            <template lwc:if={loading}>
                <lightning-spinner alternative-text="Loading" size="small"></lightning-spinner>
            </template>

            <template lwc:if={error}>
                <div class="slds-notify slds-notify_alert slds-alert_warning" role="alert">
                    <lightning-icon icon-name="utility:warning" size="x-small" class="slds-var-m-right_x-small"></lightning-icon>
                    <span>{error}</span>
                </div>
            </template>

            <template lwc:if={hasData}>
                <p class="slds-text-body_small slds-text-color_weak slds-var-m-bottom_small">
                    {periodLabel} · Net Profit = Sales − Cost of Plants Sold − Expenses
                </p>

                <!-- KPI tiles -->
                <div class="tiles">
                    <template for:each={tiles} for:item="tile">
                        <div key={tile.key} class={tile.css}>
                            <div class="tile-label">{tile.label}</div>
                            <div class="tile-value">{tile.value}</div>
                            <template lwc:if={tile.sub}>
                                <div class="tile-sub">{tile.sub}</div>
                            </template>
                        </div>
                    </template>
                </div>

                <!-- This month -->
                <template lwc:if={thisMonth}>
                    <div class="this-month">
                        <span class="this-month-title">This month · {thisMonth.label}</span>
                        <span>Sales <span class="value">{thisMonth.sales}</span></span>
                        <span>Gross profit <span class="value">{thisMonth.gross}</span></span>
                        <span>Expenses <span class="value">{thisMonth.expenses}</span></span>
                        <span>Net profit <span class={thisMonth.netCss}>{thisMonth.net}</span></span>
                    </div>
                </template>

                <div class="grid">
                    <!-- Monthly table -->
                    <div class="grid-main">
                        <h3 class="section-title">By month</h3>
                        <div class="table-wrap">
                            <table class="slds-table slds-table_cell-buffer slds-table_bordered slds-table_striped pl-table">
                                <thead>
                                    <tr class="slds-line-height_reset">
                                        <th scope="col">Month</th>
                                        <th scope="col" class="slds-text-align_right">Sales</th>
                                        <th scope="col" class="slds-text-align_right">Cost of Plants</th>
                                        <th scope="col" class="slds-text-align_right">Gross Profit</th>
                                        <th scope="col" class="slds-text-align_right">Expenses</th>
                                        <th scope="col" class="slds-text-align_right">Net Profit</th>
                                        <th scope="col" class="slds-text-align_right">Margin</th>
                                        <th scope="col" class="bar-col"><span class="slds-assistive-text">Net profit bar</span></th>
                                    </tr>
                                </thead>
                                <tbody>
                                    <template for:each={rows} for:item="row">
                                        <tr key={row.key} class={row.rowCss}>
                                            <th scope="row">{row.label}</th>
                                            <td class="slds-text-align_right num">{row.sales}</td>
                                            <td class="slds-text-align_right num">{row.cost}</td>
                                            <td class="slds-text-align_right num">{row.gross}</td>
                                            <td class="slds-text-align_right num">{row.expenses}</td>
                                            <td class={row.netCss}>{row.net}</td>
                                            <td class="slds-text-align_right num">{row.margin}</td>
                                            <td class="bar-col">
                                                <div class="bar-track"><div class={row.barCss} style={row.barStyle}></div></div>
                                            </td>
                                        </tr>
                                    </template>
                                </tbody>
                                <tfoot>
                                    <tr class="total-row">
                                        <th scope="row">Total</th>
                                        <td class="slds-text-align_right num">{total.sales}</td>
                                        <td class="slds-text-align_right num">{total.cost}</td>
                                        <td class="slds-text-align_right num">{total.gross}</td>
                                        <td class="slds-text-align_right num">{total.expenses}</td>
                                        <td class={total.netCss}>{total.net}</td>
                                        <td class="slds-text-align_right num">{total.margin}</td>
                                        <td class="bar-col"></td>
                                    </tr>
                                </tfoot>
                            </table>
                        </div>
                    </div>

                    <!-- Expenses by category -->
                    <div class="grid-side">
                        <h3 class="section-title">Expenses by category</h3>
                        <template lwc:if={hasCategories}>
                            <ul class="categories">
                                <template for:each={categories} for:item="cat">
                                    <li key={cat.key} class="category">
                                        <div class="category-head">
                                            <span class="category-name">{cat.label}</span>
                                            <span class="num">{cat.amount} <span class="slds-text-color_weak">· {cat.share}</span></span>
                                        </div>
                                        <div class="bar-track"><div class="bar bar_expense" style={cat.barStyle}></div></div>
                                    </li>
                                </template>
                            </ul>
                        </template>
                        <template lwc:else>
                            <p class="slds-text-color_weak">No expenses recorded for {yearValue}.</p>
                        </template>
                    </div>
                </div>
            </template>
        </div>
    </lightning-card>
</template>
